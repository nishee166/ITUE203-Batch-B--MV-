</head>

<body>

    

    <header>

        <h1>Student Hub Portal</h1>

        <p>Your One-Stop Learning Platform</p>

    </header>


    

    <nav>

        <a href="INDEX.html">Home</a>
        <a href="ABOUT.html">About</a>

    <section class="login-section">

        <div class="login-container">

            <div class="login-icon">
                🔐
            </div>

            <h2>Student Login</h2>

            <p class="login-subtitle">
                Enter your details to access Student Hub
            </p>


            <form action="sucess.html" method="get">

            

                <div class="input-group">

                    <label for="student-id">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="student-id"
                        name="student_id"
                        placeholder="Enter Student ID"
                        required
                    >

                </div>


                

                <div class="input-group">

                    <label for="student-name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="student-name"
                        name="student_name"
                        placeholder="Enter Your Name"
                        required
                    >

                </div>


            

                <div class="input-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="Enter Department"
                        required
                    >

                </div>


                

                <div class="input-group">

                    <label for="email">
                        Email ID
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter Email ID"
                        required
                    >

                </div>


                

                <button type="button" onclick="window.location.href='SUCCESS.html'">
                                             Login
                                       </button>

            </form>


            <p class="login-note">
                🔒 Your information is safe and secure.
            </p>

        </div>

    </section>


    

    <footer>

        <p>
            © 2026 Student Hub Portal | All Rights Reserved
        </p>

    </footer>

</body>

</html>
