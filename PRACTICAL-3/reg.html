<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Student Hub Portal</title>
    <link rel="stylesheet" href="reg.css">
</head>

<body>

<header>
    <h1>Student Hub Portal</h1>
    <p>Your One-Stop Learning Platform</p>
</header>

<section class="registration-section">

    <div class="registration-container">

        <div class="registration-icon">📝</div>

        <h2>Create Your Account</h2>

        <p class="registration-subtitle">
            Register for your Student Hub Portal account
        </p>

        <form id="registrationForm">

            <div class="input-group">
                <label for="student-id">Student ID</label>
                <input type="text" id="student-id" placeholder="Enter Student ID">
            </div>

            <div class="input-group">
                <label for="student-name">Student Name</label>
                <input type="text" id="student-name" placeholder="Enter Student Name">
            </div>

            <div class="input-group">
                <label for="department">Department</label>
                <input type="text" id="department" placeholder="Enter Department">
            </div>

            <div class="input-group">
                <label for="email">Email ID</label>
                <input type="email" id="email" placeholder="Enter Email ID">
            </div>

            <div class="input-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" placeholder="Create Password">
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm Password">
            </div>

            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the terms and conditions</label>
            </div>

            <button type="submit">Create Account</button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="LOGIN.html">Login Here</a>
        </p>

    </div>

</section>

<footer>
    <p>© 2026 Student Hub Portal | All Rights Reserved</p>
</footer>

<script src="reg.js"></script>

</body>
</html>
