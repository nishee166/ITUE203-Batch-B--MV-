<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Student Hub Portal</title>

<link rel="stylesheet" href="login.css">


</head>

<body>


<header>

    <h1>Student Hub Portal</h1>

    <p>Your One-Stop Learning Platform</p>

</header>

<section class="login-section">

    <div class="login-container">

        <div class="login-icon">
            🔐
        </div>

        <h2>Student Login</h2>

        <p class="login-subtitle">
            Enter your details to access Student Hub
        </p>

        <form action="INDEX.html" method="get">

            <div class="input-group">

                <label for="student-id">
                    Student ID
                </label>

                <input
                    type="text"
                    id="student-id"
                    name="student_id"
                    placeholder="Enter Student ID"
                    required
                    pattern="[A-Za-z0-9]+"
                >

            </div>

            <div class="input-group">

                <label for="student-name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="student-name"
                    name="student_name"
                    placeholder="Enter Your Name"
                    required
                    pattern="[A-Za-z ]+"
                >

            </div>

            <div class="input-group">

                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    name="department"
                    placeholder="Enter Department"
                    required
                    pattern="[A-Za-z ]+"
                >

            </div>

            <div class="input-group">

                <label for="email">
                    Email ID
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter Email ID"
                    required
                >

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="reg.html">Register Here</a>
        </p>

        <p class="login-note">
            🔒 Your information is safe and secure.
        </p>

    </div>

</section>

<footer>

    <p>
        © 2026 Student Hub Portal | All Rights Reserved
    </p>

</footer>


</body>

</html>
