<!DOCTYPE html>
<html>
<head>
    <title>Login Successful</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ538KkHld8LvOGitPu43s20UGfAI98mkiDJnY8HyUERw&s=10");
            background-repeat: no-repeat;
            background-size: cover;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .popup{
            width:400px;
            background:white;
            text-align:center;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px gray;
        }

        .tick{
            font-size:70px;
            color:green;
        }

        h1{
            color:#003366;
            margin-top:15px;
        }

        p{
            font-size:18px;
            margin-top:15px;
            color:#555;
        }

        button{
            margin-top:30px;
            padding:12px 35px;
            font-size:18px;
            background:#003366;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#0055a5;
        }

    </style>

</head>

<body>

<div class="popup">

    <div class="tick">✔</div>

    <h1>Login Successful!</h1>

    <p>
        Welcome to the Student Hub Portal.<br>
        You have logged in successfully.
    </p>

    <button onclick="window.location.href='login.html'">
        Back
    </button>

</div>

</body>
</html>
